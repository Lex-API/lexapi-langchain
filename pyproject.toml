[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-lexapi"
dynamic = ["version"]
description = "LangChain retrievers and tools for EU legislation and CJEU case law from LexAPI, with CELEX citations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arieta Labs Ltd", email = "support@lex-api.com" }]
keywords = ["langchain", "eur-lex", "eu", "legal", "law", "retriever", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=1.4,<2",
  "pydantic>=2.9,<3",
  "lexapi-client>=0.5.0,<0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3",
  "pytest-socket>=0.7",
  "langchain-tests>=1.1.9,<2",
  "ruff>=0.17",
  "mypy>=2.4",
  "build>=1.2",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://lex-api.com"
Documentation = "https://lex-api.com/docs"
Repository = "https://github.com/Lex-API/lexapi-langchain"
Issues = "https://github.com/Lex-API/lexapi-langchain/issues"
Changelog = "https://github.com/Lex-API/lexapi-langchain/blob/HEAD/CHANGELOG.md"

[tool.hatch.version]
path = "src/langchain_lexapi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_lexapi"]

[tool.hatch.build.targets.sdist]
include = ["src/langchain_lexapi", "tests", "README.md", "CHANGELOG.md", "SECURITY.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/langchain_lexapi", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langchain_tests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
